<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cal">
        <h2>Calculator</h2>   
        <input type="text" name="number" id="inp" placeholder="0" readonly>
        
        <!-- Grid wrapper for buttons -->
        <div class="buttons-grid">
            <button class="btn" onclick="one();">1</button>
            <button class="btn" onclick="two();">2</button>
            <button class="btn" onclick="three();">3</button>
            <button class="btn operator" onclick="plus();">+</button>

            <button class="btn" onclick="four();">4</button>
            <button class="btn" onclick="five();">5</button>
            <button class="btn" onclick="six();">6</button>
            <button class="btn operator" onclick="minus();">-</button>

            <button class="btn" onclick="seven();">7</button>
            <button class="btn" onclick="eight();">8</button>
            <button class="btn" onclick="nine();">9</button>
            <button class="btn operator" onclick="multi();">*</button>

            <button class="btn operator" onclick="divide();">/</button>
            <button class="btn" onclick="zero();">0</button>
            <button class="btn equal" id="equal" onclick="equal();">=</button>
            <button class="btn clear" id="clear" onclick="clearInput();">CL</button>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
