<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cal">
       <h2>Calculator</h2>   
    <input type="text" name="number" id="inp" placeholder="Enter Number">
    <br>
    <button id="btn" onclick="one();">1</button>
    <button id="btn" onclick="two();">2</button>
    <button id="btn" onclick="three();">3</button>
    <button id="btn" onclick="plus();">+</button>
    <br>
    <button id="btn" onclick="four();">4</button>
    <button id="btn" onclick="five();">5</button>
    <button id="btn" onclick="six();">6</button>
    <button id="btn" onclick="minus();">-</button>
    <br>
    <button id="btn" onclick="seven();">7</button>
    <button id="btn" onclick="eight();">8</button>
    <button id="btn" onclick="nine();">9</button>
    <button id="btn" onclick="multi();">*</button>
    <br>
    <button id="btn" onclick="divide();">/</button>
    <button id="btn" onclick="zero();">0</button>
    <button id="equal" onclick="equal();">=</button>
    <button id="clear" onclick="clearInput();">CL</button>
   </div>
    <script src="./index.js"></script>
</body>
</html>
